<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATLING DRAKE</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0612; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: none; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =========================================================
   GATLING DRAKE
   You fly a dragon with a gatling gun on its saddle.
   CORE TWIST: the gun builds HEAT. Heat is a resource:
   - Let it hit 100% and the gun JAMS.
   - Press SPACE / right-click to turn stored heat into FIRE BREATH.
     More heat = longer breath. Breathe from the red OVERDRIVE zone
     (80%+) for blue fire that does double damage.
   - Fire breath BURNS enemy bullets out of the air.
   - Fly through cold clouds to cool the gun quickly.
   ========================================================= */

// ---------- Canvas setup: fixed 960x540 game world, scaled to fit the window ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
cv.width = W; cv.height = H;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ---------- Small helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); }

// ---------- Sound: tiny synth using the Web Audio API (no sound files needed) ----------
let AC = null, noiseBuf = null, master = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    // half a second of white noise we reuse for gunshots / explosions / fire
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}
function tone(f1, f2, dur, vol, type = 'square') {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
const sfx = {
  shoot: () => { noise(0.05, 0.10, 2600); tone(170, 70, 0.05, 0.03); },
  hit:   () => tone(700, 300, 0.04, 0.03),
  boom:  (big) => { noise(big ? 0.9 : 0.45, big ? 0.6 : 0.35, 650); tone(120, 35, big ? 0.8 : 0.4, 0.2, 'sine'); },
  jam:   () => { tone(320, 70, 0.35, 0.15, 'sawtooth'); setTimeout(() => tone(240, 60, 0.2, 0.12, 'sawtooth'), 120); },
  roar:  (d, over) => { noise(d, 0.28, over ? 2200 : 1300); tone(over ? 140 : 95, 45, 0.7, 0.22, 'sawtooth'); },
  hurt:  () => tone(220, 55, 0.3, 0.22),
  pick:  () => { tone(600, 1300, 0.15, 0.12, 'triangle'); },
  boss:  () => { tone(60, 40, 1.6, 0.3, 'sawtooth'); tone(90, 45, 1.6, 0.2, 'square'); },
};

// ---------- Input ----------
const keys = {};
const mouse = { x: W * 0.7, y: H / 2, down: false };
let paused = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  initAudio();
  if (k === ' ') { e.preventDefault(); if (state === 'play') breathe(); else startGame(); }
  if (k === 'p' && state === 'play') paused = !paused;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function setMouse(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W;
  mouse.y = (e.clientY - r.top) / r.height * H;
}
addEventListener('mousemove', setMouse);
cv.addEventListener('mousedown', e => {
  initAudio(); setMouse(e);
  if (e.button === 2) { if (state === 'play') breathe(); return; }
  if (state !== 'play') { startGame(); return; }
  if (paused) { paused = false; return; }
  mouse.down = true;
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { mouse.down = false; for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
const held = (...ks) => ks.some(k => keys[k]);

// ---------- Colour palettes for dragons ----------
const PAL = {
  player: { body: '#2bb3a0', dark: '#13695f', belly: '#f2c46d', wing: '#5fe0c8', wingDark: '#2a9c8b', horn: '#f4ead0', eye: '#ffe14d' },
  rival:  { body: '#c2393a', dark: '#6e1620', belly: '#f0a35a', wing: '#ff6b5a', wingDark: '#a32a32', horn: '#2a1a1a', eye: '#fff36b' },
  white:  { body: '#fff', dark: '#fff', belly: '#fff', wing: '#fff', wingDark: '#fff', horn: '#fff', eye: '#fff' },
};

// ---------- Background: stars + three layers of scrolling mountains ----------
const stars = Array.from({ length: 90 }, () => ({ x: rnd(0, W), y: rnd(0, H * 0.5), s: rnd(0.5, 1.8), p: rnd(0, 6) }));
function makeRange(n, span, yMin, yMax, spd, col) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    // a few sine waves added together + jitter = mountain-ish skyline that loops seamlessly
    const v = (Math.sin(a * 2) + Math.sin(a * 5 + 1) * 0.5 + Math.sin(a * 9 + 2) * 0.25) / 1.75;
    pts.push(lerp(yMin, yMax, (v + 1) / 2) + rnd(-12, 12));
  }
  return { pts, span, spd, col };
}
const ranges = [
  makeRange(40, 1400, 230, 380, 18, '#3b1d4d'),
  makeRange(34, 1300, 320, 450, 45, '#28123a'),
  makeRange(28, 1200, 410, 510, 95, '#150a22'),
];
let clouds = [];   // the cold foreground clouds
let cloudTimer = 2;
function makeCloud(x) {
  const w = rnd(110, 210), h = rnd(45, 70);
  const puffs = Array.from({ length: 7 }, () => ({ dx: rnd(-w / 2, w / 2), dy: rnd(-h / 3, h / 3), r: rnd(h * 0.45, h * 0.8) }));
  return { x, y: rnd(60, H - 90), w, h, puffs, spd: rnd(110, 150) };
}

// ---------- Game state ----------
let state = 'title';          // 'title' | 'play' | 'over'
// arrays start EMPTY (not undefined) so the title screen can loop over them safely
let P, bullets = [], ebullets = [], enemies = [], parts = [], flames = [], pickups = [], timers = [];
let score, best = 0, wave, queue, waveTimer, combo, comboT, shake, banner, time = 0, scroll = 0, overT = 0, hintT;
try { best = +localStorage.getItem('gatlingDrakeBest') || 0; } catch (e) {}

function startGame() {
  if (state === 'over' && overT < 1) return;   // small delay so you don't restart by accident
  P = { x: 200, y: H / 2, vx: 0, vy: 0, hp: 100, heat: 0, jam: 0, cool: 0, fireCd: 0, inv: 1.5,
        breath: 0, over: false, frost: 0, aim: 0, spin: 0, t: 0, inCloud: false };
  bullets = []; ebullets = []; enemies = []; parts = []; flames = []; pickups = []; timers = [];
  score = 0; wave = 0; queue = []; waveTimer = 1.2; combo = 1; comboT = 0; shake = 0; banner = null; hintT = 12;
  paused = false; state = 'play';
}

// ---------- Waves ----------
function genWave(w) {
  const q = [];
  if (w % 5 === 0) {                         // every 5th wave is a boss
    q.push({ type: 'boss', d: 1.5 });
    for (let i = 0; i < w / 5 * 3; i++) q.push({ type: 'garg', d: rnd(2, 4) });
    return q;
  }
  const n = 5 + w * 2;
  for (let i = 0; i < n; i++) {
    let pool = ['garg', 'garg', 'garg'];
    if (w >= 2) pool.push('knight', 'knight');
    if (w >= 3) pool.push('wyv');
    if (w >= 4 && i % 7 === 6) pool = ['ship'];
    q.push({ type: pool[Math.floor(Math.random() * pool.length)], d: i === 0 ? 1 : rnd(0.35, 1.1) * Math.max(0.4, 1 - w * 0.05) });
  }
  return q;
}

// ---------- Enemies ----------
function spawn(type) {
  const y = rnd(60, H - 60);
  const e = { type, x: W + 60, y, baseY: y, t: 0, flash: 0 };
  if (type === 'garg')   Object.assign(e, { hp: 3, r: 18, score: 100, spd: rnd(170, 250), amp: rnd(20, 70), freq: rnd(2, 4) });
  if (type === 'knight') Object.assign(e, { hp: 7, r: 20, score: 250, tx: rnd(W * 0.62, W * 0.9), shot: rnd(0.8, 1.6), stay: rnd(7, 10) });
  if (type === 'wyv')    Object.assign(e, { hp: 14, r: 26, score: 450, mode: 0, cd: rnd(1, 2), vx: 0, vy: 0, mt: 0, dir: -1 });
  if (type === 'ship')   { Object.assign(e, { hp: 45, r: 50, score: 900, shot: 2, x: W + 90, y: rnd(120, H - 160) }); e.baseY = e.y; }
  if (type === 'boss') {
    Object.assign(e, { hp: 220 + wave * 35, r: 30, score: 6000, shot: 1, ring: 4, segs: [] });
    banner = { text: '⚠ THE IRON WYRM ⚠', sub: 'aim for the head — 2× damage', t: 3 };
    sfx.boss();
  }
  e.maxhp = e.hp;
  enemies.push(e);
}

// the boss follows a looping path; each body segment is the same path but slightly in the past
function wyrmPos(t) {
  const ent = Math.max(0, 3.5 - t) * 260;   // entrance: starts far off to the right
  return { x: W * 0.7 + Math.cos(t * 0.8) * W * 0.2 + ent, y: H / 2 + Math.sin(t * 1.6) * H * 0.3 };
}

function eshoot(x, y, a, s, r = 5, col = '#ff4f8b') {
  ebullets.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r, col });
}
const aimAt = (x, y) => Math.atan2(P.y - y, P.x - x);

function updateEnemy(e, dt) {
  e.t += dt; e.flash -= dt;
  switch (e.type) {
    case 'garg':  // stone gargoyle: wobbles across the screen
      e.x -= e.spd * dt;
      e.y = e.baseY + Math.sin(e.t * e.freq) * e.amp;
      if (e.x < -60) e.gone = true;
      break;
    case 'knight':  // sky-knight on a glider: parks, shoots, leaves
      if (!e.leaving) { e.x += (e.tx - e.x) * 1.5 * dt; e.stay -= dt; if (e.stay <= 0) e.leaving = true; }
      else { e.x += 220 * dt; if (e.x > W + 80) e.gone = true; }
      e.y = e.baseY + Math.sin(e.t * 1.5) * 30;
      e.shot -= dt;
      if (e.shot <= 0 && e.x < W - 20 && !e.leaving) { e.shot = rnd(1.3, 2); eshoot(e.x - 20, e.y, aimAt(e.x, e.y), 270); }
      break;
    case 'wyv':  // rival dragon: hovers, then charges at you and spits fire
      e.cd -= dt;
      if (e.mode === 0) {
        e.dir = -1;
        e.x += (W * 0.82 - e.x) * 1.8 * dt;
        e.y += (P.y - e.y) * 0.8 * dt;
        if (e.cd <= 0 && e.x < W - 30) {
          e.mode = 1; e.mt = 0;
          const a = aimAt(e.x, e.y);
          e.vx = Math.cos(a) * 430; e.vy = Math.sin(a) * 430;
          eshoot(e.x, e.y, a, 380, 9, '#ff9a2e');
        }
      } else {
        e.dir = e.vx > 0 ? 1 : -1;
        e.x += e.vx * dt; e.y += e.vy * dt; e.mt += dt;
        if (e.mt > 1.3) { e.mode = 0; e.cd = rnd(1.8, 3); }
      }
      e.y = clamp(e.y, 30, H - 30);
      break;
    case 'ship':  // war zeppelin: slow tank that fires 5-way spreads
      e.x -= (e.x > W * 0.8 ? 70 : 10) * dt;
      e.y = e.baseY + Math.sin(e.t * 0.9) * 14;
      e.shot -= dt;
      if (e.shot <= 0 && e.x < W - 30) {
        e.shot = 2.2;
        const a = aimAt(e.x - 40, e.y + 22);
        for (let k = -2; k <= 2; k++) eshoot(e.x - 40, e.y + 22, a + k * 0.18, 210);
      }
      if (e.x < -120) e.gone = true;
      break;
    case 'boss': {
      e.segs = [];
      for (let i = 0; i < 15; i++) {
        const p = wyrmPos(e.t - i * 0.13);
        e.segs.push({ x: p.x, y: p.y, r: i === 0 ? 30 : Math.max(12, 22 - i * 0.6) });
      }
      e.x = e.segs[0].x; e.y = e.segs[0].y;
      if (e.t > 3.5) {
        const angry = e.hp < e.maxhp / 2;
        e.shot -= dt;
        if (e.shot <= 0) {
          e.shot = angry ? 0.45 : 0.85;
          const s = e.segs[1 + Math.floor(Math.random() * 14)];
          eshoot(s.x, s.y, aimAt(s.x, s.y), 250);
        }
        e.ring -= dt;
        if (e.ring <= 0) {
          e.ring = angry ? 2.6 : 4;
          const off = Math.random();
          for (let k = 0; k < 18; k++) eshoot(e.x, e.y, off + k / 18 * Math.PI * 2, 190, 6, '#ffb03a');
        }
      }
      break;
    }
  }
}

// returns 0 = miss, 1 = hit, 2 = boss head hit (double damage)
function hitEnemy(e, x, y, r) {
  if (e.type === 'boss') {
    if (!e.segs.length || e.t < 2.5) return 0;
    for (let i = 0; i < e.segs.length; i++) {
      const s = e.segs[i];
      if (dist(x, y, s.x, s.y) < s.r + r) return i === 0 ? 2 : 1;
    }
    return 0;
  }
  return dist(x, y, e.x, e.y) < e.r + r ? 1 : 0;
}

function damage(e, d, x, y) {
  if (e.dead) return;
  e.hp -= d; e.flash = 0.06;
  for (let i = 0; i < 2; i++) spark(x, y, '#ffe9a8');
  if (Math.random() < 0.3) sfx.hit();
  if (e.hp <= 0) kill(e);
}

function kill(e) {
  e.dead = true;
  combo = comboT > 0 ? Math.min(8, combo + 1) : 1;
  comboT = 2.2;
  const pts = e.score * combo;
  score += pts;
  text(e.x, e.y - 20, '+' + pts + (combo > 1 ? '  x' + combo : ''), combo > 3 ? '#ff7bd5' : '#ffe14d');
  if (e.type === 'boss') {
    // chain of explosions running down the body
    e.segs.forEach((s, i) => timers.push({ t: i * 0.09, fn: () => explode(s.x, s.y, 1.4) }));
    timers.push({ t: 1.5, fn: () => { explode(e.x, e.y, 3); banner = { text: 'WYRM SLAIN!', sub: '+' + pts, t: 2.5 }; } });
    for (let i = 0; i < 4; i++) dropPickup(e.x + rnd(-60, 60), e.y + rnd(-60, 60), i === 0 ? 'meat' : 'gold');
  } else {
    explode(e.x, e.y, e.r / 20);
    const chance = e.type === 'ship' ? 1 : e.type === 'wyv' ? 0.35 : 0.1;
    if (Math.random() < chance) dropPickup(e.x, e.y);
  }
}

// ---------- Pickups ----------
function dropPickup(x, y, type) {
  if (!type) { const r = Math.random(); type = r < 0.4 ? 'meat' : r < 0.7 ? 'frost' : 'gold'; }
  pickups.push({ x, y, type, t: 0 });
}

// ---------- Particles ----------
function spark(x, y, col) {
  const a = rnd(0, Math.PI * 2), s = rnd(80, 300);
  parts.push({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.2, 0.5), max: 0.5, r: rnd(2, 4), col });
}
function smoke(x, y, r = 10) {
  parts.push({ type: 'smoke', x, y, vx: rnd(-30, 30) - 60, vy: rnd(-40, -10), life: rnd(0.6, 1.2), max: 1.2, r });
}
function text(x, y, s, col) { parts.push({ type: 'text', x, y, vx: 0, vy: -40, life: 1.2, max: 1.2, s, col }); }
function explode(x, y, size = 1) {
  parts.push({ type: 'ring', x, y, vx: 0, vy: 0, life: 0.45, max: 0.45, r: 50 * size });
  parts.push({ type: 'flash', x, y, vx: 0, vy: 0, life: 0.18, max: 0.18, r: 45 * size });
  for (let i = 0; i < 14 * size; i++) spark(x, y, Math.random() < 0.5 ? '#ffb347' : '#ff5e3a');
  for (let i = 0; i < 6 * size; i++) smoke(x + rnd(-15, 15), y + rnd(-15, 15), 14 * size);
  shake = Math.max(shake, 6 * size);
  sfx.boom(size > 1.5);
}

// ---------- Player actions ----------
function gunPos() { return { x: P.x + 2, y: P.y - 20 }; }
function mouthPos() { return { x: P.x + 66, y: P.y - 19 }; }

function breathe() {
  if (P.breath > 0 || P.jam > 0) return;
  if (P.heat < 25) { text(P.x, P.y - 50, 'NOT ENOUGH HEAT', '#9fb3c8'); return; }
  P.over = P.heat >= 80;
  P.breath = 0.35 + P.heat / 100 * 1.4;   // more stored heat = longer breath
  sfx.roar(P.breath, P.over);
  if (P.over) text(P.x, P.y - 55, 'OVERDRIVE!', '#7fd8ff');
  P.heat = 0;
}

function hurt(n) {
  if (P.inv > 0) return;
  P.hp -= n; P.inv = 1; shake = 12;
  sfx.hurt();
  for (let i = 0; i < 8; i++) spark(P.x, P.y, '#ff4f6b');
  if (P.hp <= 0) {
    P.hp = 0;
    explode(P.x, P.y, 2.5);
    state = 'over'; overT = 0; mouse.down = false;
    if (score > best) { best = score; try { localStorage.setItem('gatlingDrakeBest', best); } catch (e) {} }
  }
}

// ---------- Main update ----------
function update(dt) {
  time += dt;
  scroll += dt;

  // clouds drift past whatever the state
  cloudTimer -= dt;
  if (cloudTimer <= 0) { clouds.push(makeCloud(W + 150)); cloudTimer = rnd(4, 8); }
  clouds.forEach(c => c.x -= c.spd * dt);
  clouds = clouds.filter(c => c.x > -250);

  if (state === 'play') updateGame(dt);
  else overT += dt;

  // particles always animate
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.type === 'casing') { p.vy += 900 * dt; p.rot += 12 * dt; }
    if (p.type === 'spark') { p.vx *= 0.92; p.vy *= 0.92; }
  }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - 30 * dt);
}

function updateGame(dt) {
  P.t += dt;
  hintT -= dt;

  // --- movement: acceleration + drag feels floaty, like flying ---
  const ax = (held('d', 'arrowright') ? 1 : 0) - (held('a', 'arrowleft') ? 1 : 0);
  const ay = (held('s', 'arrowdown') ? 1 : 0) - (held('w', 'arrowup') ? 1 : 0);
  P.vx += ax * 2800 * dt; P.vy += ay * 2800 * dt;
  P.vx -= P.vx * 8 * dt;  P.vy -= P.vy * 8 * dt;
  P.x = clamp(P.x + P.vx * dt, 60, W * 0.62);
  P.y = clamp(P.y + P.vy * dt, 105, H - 35);   // 105 keeps the dragon below the HUD
  P.inv -= dt; P.frost -= dt;

  // --- aiming ---
  const g = gunPos();
  P.aim = Math.atan2(mouse.y - g.y, mouse.x - g.x);

  // --- are we inside a cold cloud? ---
  P.inCloud = clouds.some(c => Math.abs(P.x - c.x) < c.w / 2 + 10 && Math.abs(P.y - c.y) < c.h / 2 + 10);

  // --- gatling gun ---
  P.fireCd -= dt; P.cool -= dt;
  const firing = mouse.down && P.jam <= 0;
  if (firing) P.spin += dt * 40;
  if (firing && P.fireCd <= 0) {
    P.fireCd = 0.065;
    const hot = P.heat >= 80;                                   // red-zone bullets hit harder
    const a = P.aim + rnd(-0.04, 0.04) * (1 + P.heat / 60);     // gun gets less accurate when hot
    const mx = g.x + Math.cos(P.aim) * 40, my = g.y + Math.sin(P.aim) * 40;
    bullets.push({ x: mx, y: my, vx: Math.cos(a) * 950, vy: Math.sin(a) * 950, hot });
    parts.push({ type: 'flash', x: mx, y: my, vx: 0, vy: 0, life: 0.05, max: 0.05, r: 14 });
    parts.push({ type: 'casing', x: g.x, y: g.y, vx: rnd(-80, -20), vy: rnd(-200, -120), life: 0.8, max: 0.8, rot: 0 });
    if (P.frost <= 0) P.heat += 2.3;
    P.cool = 0.3;
    sfx.shoot();
    if (P.heat >= 100) {
      P.heat = 100; P.jam = 1.6;
      sfx.jam(); text(P.x, P.y - 55, 'JAMMED!', '#ff5b5b');
    }
  }
  // cooling
  if (P.jam > 0) {
    P.jam -= dt; P.heat = Math.max(0, P.heat - 40 * dt);
    if (Math.random() < 0.5) smoke(g.x + Math.cos(P.aim) * 30, g.y + Math.sin(P.aim) * 30, 6);
  } else if (P.cool <= 0) P.heat = Math.max(0, P.heat - 30 * dt);
  if (P.inCloud) {
    P.heat = Math.max(0, P.heat - 75 * dt);
    if (P.heat > 5 && Math.random() < 0.4) smoke(g.x, g.y - 5, 5);   // steam!
  }

  // --- fire breath ---
  if (P.breath > 0) {
    P.breath -= dt;
    const m = mouthPos();
    const a = Math.atan2(mouse.y - m.y, mouse.x - m.x);
    const n = Math.ceil(140 * dt);
    for (let i = 0; i < n; i++) {
      const fa = a + rnd(-0.17, 0.17), s = rnd(450, 620);
      flames.push({ x: m.x, y: m.y, vx: Math.cos(fa) * s + P.vx * 0.5, vy: Math.sin(fa) * s + P.vy * 0.5,
                    life: rnd(0.4, 0.6), max: 0.6, r: rnd(6, 10), over: P.over, hit: new Set() });
    }
  }
  for (const f of flames) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.97; f.vy *= 0.97; f.life -= dt; f.r += 45 * dt;
    for (const e of enemies) {
      if (e.dead || f.hit.has(e)) continue;
      const h = hitEnemy(e, f.x, f.y, f.r * 0.6);
      if (h) { f.hit.add(e); damage(e, (f.over ? 1.0 : 0.45) * h, f.x, f.y); }
    }
    for (const b of ebullets) {   // fire burns bullets out of the air
      if (!b.dead && dist(f.x, f.y, b.x, b.y) < f.r + b.r) { b.dead = true; smoke(b.x, b.y, 5); }
    }
  }
  flames = flames.filter(f => f.life > 0);

  // --- waves ---
  if (queue.length) {
    queue[0].d -= dt;
    if (queue[0].d <= 0) spawn(queue.shift().type);
  } else if (!enemies.length) {
    waveTimer -= dt;
    if (waveTimer <= 0) {
      wave++;
      queue = genWave(wave);
      if (wave % 5 !== 0) banner = { text: 'WAVE ' + wave, sub: '', t: 2 };
      waveTimer = 2.5;
    }
  }

  // --- enemies ---
  for (const e of enemies) {
    updateEnemy(e, dt);
    if (e.dead) continue;
    // body contact
    if (e.type === 'boss') {
      if (e.t > 2.5 && e.segs.some(s => dist(s.x, s.y, P.x, P.y) < s.r + 18)) hurt(20);
    } else if (dist(e.x, e.y, P.x, P.y) < e.r + 18) {
      if (P.inv <= 0) damage(e, 5, e.x, e.y);
      hurt(e.type === 'ship' ? 30 : 18);
    }
  }
  enemies = enemies.filter(e => !e.dead && !e.gone);

  // --- player bullets ---
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { b.dead = true; continue; }
    for (const e of enemies) {
      if (e.dead) continue;
      const h = hitEnemy(e, b.x, b.y, 4);
      if (h) { damage(e, (b.hot ? 1.6 : 1) * h, b.x, b.y); b.dead = true; break; }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // --- enemy bullets ---
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) b.dead = true;
    else if (dist(b.x, b.y, P.x + 5, P.y) < b.r + 16 && P.inv <= 0) { b.dead = true; hurt(b.r > 7 ? 15 : 10); }
  }
  ebullets = ebullets.filter(b => !b.dead);

  // --- pickups ---
  for (const p of pickups) {
    p.t += dt; p.x -= 80 * dt;
    if (dist(p.x, p.y, P.x, P.y) < 34) {
      p.dead = true; sfx.pick();
      if (p.type === 'meat') { P.hp = Math.min(100, P.hp + 25); text(p.x, p.y, '+25 HP', '#7dff8a'); }
      if (p.type === 'frost') { P.heat = 0; P.frost = 5; P.jam = 0; text(p.x, p.y, 'ICE CORE! no heat 5s', '#7fd8ff'); }
      if (p.type === 'gold') { score += 500; text(p.x, p.y, '+500', '#ffe14d'); }
    }
    if (p.x < -30) p.dead = true;
  }
  pickups = pickups.filter(p => !p.dead);

  // --- delayed events (boss death chain) ---
  for (const t of timers) { t.t -= dt; if (t.t <= 0 && !t.done) { t.done = true; t.fn(); } }
  timers = timers.filter(t => !t.done);

  comboT -= dt; if (comboT <= 0) combo = 1;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
}

// =========================================================
//                        DRAWING
// =========================================================
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#140a26'); g.addColorStop(0.45, '#4a1f57');
  g.addColorStop(0.78, '#c9554a'); g.addColorStop(1, '#f4a25e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // twinkling stars, fading out lower in the sky
  for (const s of stars) {
    ctx.globalAlpha = (1 - s.y / (H * 0.5)) * (0.5 + 0.5 * Math.sin(time * 2 + s.p));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // big striped sunset sun
  const sx = W * 0.72, sy = 330, sr = 110;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, sr * 2.2);
  sg.addColorStop(0, 'rgba(255,200,120,0.5)'); sg.addColorStop(1, 'rgba(255,120,80,0)');
  ctx.fillStyle = sg; circ(sx, sy, sr * 2.2);
  const sg2 = ctx.createLinearGradient(0, sy - sr, 0, sy + sr);
  sg2.addColorStop(0, '#ffe08a'); sg2.addColorStop(1, '#ff5a6e');
  ctx.fillStyle = sg2; circ(sx, sy, sr);
  ctx.fillStyle = '#8e3a5c';
  for (let i = 0; i < 6; i++) { const y = sy + 10 + i * 16; ctx.fillRect(sx - sr, y, sr * 2, 2 + i * 1.3); }

  // mountain ranges (each scrolls at a different speed = parallax depth)
  for (const L of ranges) {
    const step = L.span / L.pts.length, off = (scroll * L.spd) % L.span;
    ctx.fillStyle = L.col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let k = 0; k < 3; k++) for (let i = 0; i < L.pts.length; i++) {
      const x = k * L.span + i * step - off;
      if (x < -step || x > W + step) continue;
      ctx.lineTo(x, L.pts[i]);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
}

function wing(f, fill, bone, ox) {
  const b = -8;
  const E = [ox + 14, b - 46 * f], T = [ox - 24, b - 80 * f], F2 = [ox - 42, b - 52 * f], F3 = [ox - 46, b - 22 * f];
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(ox + 6, b); ctx.lineTo(E[0], E[1]); ctx.lineTo(T[0], T[1]);
  ctx.quadraticCurveTo(ox - 26, b - 54 * f, F2[0], F2[1]);
  ctx.quadraticCurveTo(ox - 34, b - 28 * f, F3[0], F3[1]);
  ctx.quadraticCurveTo(ox - 30, b - 6 * f, ox - 22, b + 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = bone; ctx.lineWidth = 2.5; ctx.beginPath();
  ctx.moveTo(ox + 6, b); ctx.lineTo(E[0], E[1]); ctx.lineTo(T[0], T[1]);
  ctx.moveTo(E[0], E[1]); ctx.lineTo(F2[0], F2[1]);
  ctx.moveTo(E[0], E[1]); ctx.lineTo(F3[0], F3[1]);
  ctx.stroke();
}

// draws a dragon facing right (dir=1) or left (dir=-1)
function drawDragon(x, y, dir, sc, t, C) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir * sc, sc);
  ctx.lineCap = 'round';
  // tail
  const tx = -80, ty = Math.sin(t * 4 - 1) * 14;
  ctx.strokeStyle = C.dark; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(-20, 2); ctx.quadraticCurveTo(-55, 8 + Math.sin(t * 4) * 8, tx, ty); ctx.stroke();
  ctx.fillStyle = C.dark; ctx.beginPath();
  ctx.moveTo(tx + 4, ty); ctx.lineTo(tx - 14, ty - 9); ctx.lineTo(tx - 22, ty); ctx.lineTo(tx - 14, ty + 9); ctx.closePath(); ctx.fill();
  // far wing (darker, slightly out of sync)
  wing(0.3 + 0.7 * Math.sin(t * 9 - 0.4), C.wingDark, C.dark, -6);
  // legs
  ctx.strokeStyle = C.dark; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(12, 8); ctx.lineTo(18, 22); ctx.moveTo(-14, 8); ctx.lineTo(-10, 22); ctx.stroke();
  // back spikes
  ctx.fillStyle = C.dark;
  for (let i = 0; i < 5; i++) { const sx = -22 + i * 10; ctx.beginPath(); ctx.moveTo(sx - 4, -12); ctx.lineTo(sx, -21); ctx.lineTo(sx + 4, -12); ctx.fill(); }
  // body + belly
  ctx.fillStyle = C.body; ell(0, 0, 34, 15);
  ctx.fillStyle = C.belly; ell(4, 6, 26, 7);
  // neck
  ctx.strokeStyle = C.body; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(22, -4); ctx.quadraticCurveTo(40, -6, 46, -20); ctx.stroke();
  // head
  ctx.fillStyle = C.body; ell(52, -22, 15, 10, -0.2); ell(64, -18, 11, 6);
  ctx.strokeStyle = C.horn; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(46, -28); ctx.lineTo(33, -40); ctx.moveTo(51, -30); ctx.lineTo(42, -45); ctx.stroke();
  ctx.fillStyle = C.eye; circ(56, -25, 2.8);
  ctx.fillStyle = C.dark; circ(72, -20, 1.5);
  // near wing
  wing(0.3 + 0.7 * Math.sin(t * 9), C.wing, C.dark, 0);
  ctx.restore();
}

function heatCol(h, a = 1) {
  return `rgba(${lerp(115, 255, h) | 0},${lerp(120, 80, h) | 0},${lerp(130, 25, h) | 0},${a})`;
}

function drawPlayer() {
  if (P.inv > 0 && Math.floor(P.inv * 20) % 2 === 0) return;  // blink while invincible
  drawDragon(P.x, P.y, 1, 1, P.t, PAL.player);
  // gatling gun on the saddle
  const g = gunPos(), h = P.heat / 100;
  ctx.save(); ctx.translate(g.x, g.y);
  ctx.fillStyle = '#5a3a22'; ctx.fillRect(-14, 4, 24, 8);           // saddle
  ctx.rotate(P.aim);
  if (h > 0.6) { ctx.shadowColor = '#ff6a2a'; ctx.shadowBlur = 20 * h; }
  for (let k = 0; k < 3; k++) {                                       // 3 spinning barrels
    const y = Math.sin(P.spin + k * 2.094) * 4.5;
    ctx.fillStyle = heatCol(h); ctx.fillRect(6, y - 1.7, 32, 3.4);
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#2b2f38'; ctx.fillRect(32, -6.5, 5, 13); ctx.fillRect(10, -6.5, 4, 13);
  ctx.fillStyle = '#3b3f4a'; ctx.beginPath(); ctx.roundRect(-10, -8, 20, 16, 4); ctx.fill();
  ctx.fillStyle = '#7a5530'; circ(-4, 9, 7);                           // ammo drum
  ctx.fillStyle = '#c99a5b'; circ(-4, 9, 3);
  ctx.restore();
  if (P.frost > 0) { ctx.strokeStyle = 'rgba(127,216,255,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P.x, P.y - 5, 50 + Math.sin(time * 8) * 3, 0, Math.PI * 2); ctx.stroke(); }
}

function drawEnemy(e) {
  const fl = e.flash > 0;
  ctx.save();
  if (e.type === 'garg') {
    ctx.translate(e.x, e.y);
    const f = Math.sin(e.t * 14);
    ctx.fillStyle = fl ? '#fff' : '#4d4858';
    for (const s of [1, -1]) {   // two bat wings
      ctx.beginPath(); ctx.moveTo(2, -2);
      ctx.lineTo(14, -6 - 22 * f * s); ctx.lineTo(30, -2 - 14 * f * s); ctx.lineTo(20, 2); ctx.lineTo(26, 8 - 6 * f * s);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = fl ? '#fff' : '#7a7484'; circ(0, 0, 12); circ(-11, -7, 8);
    ctx.fillStyle = fl ? '#fff' : '#5b5566';
    ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(-18, -22); ctx.lineTo(-9, -14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-7, -13); ctx.lineTo(-6, -23); ctx.lineTo(-3, -12); ctx.fill();
    ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = 8; ctx.fillStyle = '#ff3b3b';
    circ(-14, -8, 2); circ(-9, -8, 2);
  }
  if (e.type === 'knight') {
    ctx.translate(e.x, e.y);
    ctx.strokeStyle = '#3b2a20'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, -24); ctx.lineTo(-3, -10); ctx.moveTo(10, -24); ctx.lineTo(3, -10); ctx.stroke();
    ctx.fillStyle = fl ? '#fff' : '#d9c38a'; ell(0, -26, 34, 6);                     // glider wing
    ctx.fillStyle = fl ? '#fff' : '#b0473a'; ctx.fillRect(-20, -28, 6, 4); ctx.fillRect(14, -28, 6, 4);
    ctx.fillStyle = fl ? '#fff' : '#9aa3b5'; ctx.fillRect(-6, -8, 12, 20);          // armour
    ctx.fillStyle = fl ? '#fff' : '#c9d0dc'; circ(0, -12, 7);                       // helmet
    ctx.fillStyle = '#1a1a22'; ctx.fillRect(-7, -13, 6, 2);
    ctx.fillStyle = '#e8413c'; ell(4, -20, 6, 3, 0.4);                              // plume
    ctx.fillStyle = '#2b2f38'; ctx.fillRect(-26, -1, 22, 4);                        // musket
    ctx.fillStyle = '#666'; ell(10, 2, 2, 10 * Math.abs(Math.sin(e.t * 30)));     // propeller
  }
  if (e.type === 'wyv') {
    ctx.restore(); ctx.save();
    drawDragon(e.x, e.y, e.dir, 0.85, e.t * 1.2, fl ? PAL.white : PAL.rival);
  }
  if (e.type === 'ship') {
    ctx.translate(e.x, e.y);
    ctx.fillStyle = '#3b2a20';                                                        // tail fins
    ctx.beginPath(); ctx.moveTo(50, -14); ctx.lineTo(84, -40); ctx.lineTo(80, -10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(50, -6); ctx.lineTo(84, 20); ctx.lineTo(80, -10); ctx.fill();
    const g = ctx.createLinearGradient(0, -40, 0, 20);
    g.addColorStop(0, fl ? '#fff' : '#b07a52'); g.addColorStop(1, fl ? '#fff' : '#5e3a26');
    ctx.fillStyle = g; ell(0, -10, 72, 30);
    ctx.strokeStyle = 'rgba(40,20,10,0.5)'; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.ellipse(0, -10, Math.abs(i) * 16 + 4, 30, 0, -Math.PI / 2, Math.PI / 2, i < 0); ctx.stroke(); }
    ctx.strokeStyle = '#2a1a10'; ctx.beginPath(); ctx.moveTo(-20, 18); ctx.lineTo(-24, 22); ctx.moveTo(20, 18); ctx.lineTo(16, 22); ctx.stroke();
    ctx.fillStyle = '#2a1d16'; ctx.fillRect(-34, 20, 56, 16);                       // gondola
    ctx.fillStyle = '#ffb347'; for (let i = 0; i < 4; i++) ctx.fillRect(-28 + i * 12, 25, 5, 5);
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-48, 24, 16, 5);                        // cannon
    ctx.fillStyle = '#888'; ell(76, -10, 3, 18 * Math.abs(Math.sin(e.t * 25)));    // propeller
  }
  if (e.type === 'boss') {
    // body segments from tail to neck
    for (let i = e.segs.length - 1; i >= 1; i--) {
      const s = e.segs[i];
      ctx.fillStyle = fl ? '#fff' : '#596170'; circ(s.x, s.y, s.r);
      ctx.strokeStyle = '#262a33'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#2d323c';
      ctx.beginPath(); ctx.moveTo(s.x - 6, s.y - s.r + 2); ctx.lineTo(s.x, s.y - s.r - 12); ctx.lineTo(s.x + 6, s.y - s.r + 2); ctx.fill();
      ctx.fillStyle = `rgba(255,${120 + Math.sin(time * 6 + i) * 60 | 0},40,0.9)`; circ(s.x, s.y, s.r * 0.3);
      ctx.fillStyle = '#9aa3b5'; circ(s.x - s.r * 0.6, s.y, 1.6); circ(s.x + s.r * 0.6, s.y, 1.6);
    }
    // head, rotated to face its direction of travel
    const h = e.segs[0], n = e.segs[1];
    const a = Math.atan2(h.y - n.y, h.x - n.x);
    ctx.translate(h.x, h.y); ctx.rotate(a);
    ctx.fillStyle = fl ? '#fff' : '#6b7383'; ell(0, 0, 36, 22);
    ctx.fillStyle = '#3a404c';
    ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(46, 14 + Math.sin(time * 10) * 4); ctx.lineTo(4, 20); ctx.fill();     // jaw
    ctx.strokeStyle = '#c9d0dc'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(-34, -36); ctx.moveTo(4, -20); ctx.lineTo(-14, -42); ctx.stroke();
    ctx.shadowColor = '#ff3d1a'; ctx.shadowBlur = 16; ctx.fillStyle = '#ff5522';
    ell(14, -8, 6, 4);
  }
  ctx.restore();

  // health bars for tougher enemies
  if (e.type !== 'garg' && e.type !== 'boss' && e.hp < e.maxhp) {
    const w = e.r * 1.6;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 22, w, 4);
    ctx.fillStyle = '#ff5b5b'; ctx.fillRect(e.x - w / 2, e.y - e.r - 22, w * e.hp / e.maxhp, 4);
  }
}

function drawPickup(p) {
  const y = p.y + Math.sin(p.t * 4) * 5;
  ctx.save(); ctx.translate(p.x, y);
  ctx.shadowBlur = 14;
  if (p.type === 'meat') {
    ctx.shadowColor = '#7dff8a';
    ctx.fillStyle = '#f2e6d0'; ctx.fillRect(4, -2, 12, 4); circ(17, -3, 3); circ(17, 3, 3);
    ctx.fillStyle = '#b5532f'; ell(-3, 0, 11, 9);
  } else if (p.type === 'frost') {
    ctx.shadowColor = '#7fd8ff'; ctx.fillStyle = '#bfefff'; ctx.rotate(p.t * 2);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(7, 0); ctx.lineTo(0, 13); ctx.lineTo(-7, 0); ctx.closePath(); ctx.fill();
  } else {
    ctx.shadowColor = '#ffe14d'; ctx.fillStyle = '#ffcc33'; ell(0, 0, 10 * Math.abs(Math.cos(p.t * 4)) + 1, 10);
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.type === 'spark') { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
    else if (p.type === 'smoke') { ctx.globalAlpha = a * 0.45; ctx.fillStyle = '#3a3040'; circ(p.x, p.y, p.r * (2 - a)); }
    else if (p.type === 'ring') { ctx.strokeStyle = '#ffd38a'; ctx.lineWidth = 5 * a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.2 - a), 0, Math.PI * 2); ctx.stroke(); }
    else if (p.type === 'flash') { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#fff3c4'; circ(p.x, p.y, p.r * a); }
    else if (p.type === 'casing') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#e0b04a'; ctx.fillRect(-3, -1.2, 6, 2.4); ctx.restore(); }
    else if (p.type === 'text') { ctx.font = 'bold 16px "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(p.s, p.x + 2, p.y + 2); ctx.fillStyle = p.col; ctx.fillText(p.s, p.x, p.y); }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}

function drawFlames() {
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flames) {
    const a = f.life / f.max;   // 1 = fresh, 0 = dying
    let col;
    if (f.over) col = a > 0.6 ? '220,245,255' : a > 0.3 ? '90,170,255' : '120,60,255';     // blue overdrive fire
    else        col = a > 0.6 ? '255,240,170' : a > 0.3 ? '255,140,40' : '200,40,30';
    ctx.fillStyle = `rgba(${col},${a * 0.55})`; circ(f.x, f.y, f.r);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawBullets() {
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.strokeStyle = b.hot ? '#ff6a3a' : '#fff1a8'; ctx.lineWidth = b.hot ? 4 : 3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018); ctx.stroke();
  }
  for (const b of ebullets) {
    ctx.fillStyle = b.col; ctx.shadowColor = b.col; ctx.shadowBlur = 10; circ(b.x, b.y, b.r);
    ctx.fillStyle = '#fff'; circ(b.x, b.y, b.r * 0.4);
  }
  ctx.shadowBlur = 0;
}

function drawClouds() {
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(205,225,255,0.32)';
    for (const p of c.puffs) circ(c.x + p.dx, c.y + p.dy, p.r);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    for (const p of c.puffs) circ(c.x + p.dx - 4, c.y + p.dy - 6, p.r * 0.6);
  }
}

function label(s, x, y, size, col, align = 'left') {
  ctx.font = `bold ${size}px "Trebuchet MS", sans-serif`; ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawHUD() {
  // HP
  label('HP', 20, 30, 14, '#fff');
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(50, 18, 200, 14);
  ctx.fillStyle = P.hp > 35 ? '#5fe08a' : '#ff5b5b'; ctx.fillRect(50, 18, 2 * P.hp, 14);

  // HEAT gauge with the OVERDRIVE red zone
  label('HEAT', 20, 56, 14, '#fff');
  const hx = 70, hw = 180;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(hx, 44, hw, 14);
  ctx.fillStyle = 'rgba(255,60,60,0.25)'; ctx.fillRect(hx + hw * 0.8, 44, hw * 0.2, 14);
  const hg = ctx.createLinearGradient(hx, 0, hx + hw, 0);
  hg.addColorStop(0, '#ffd166'); hg.addColorStop(0.8, '#ff7b2a'); hg.addColorStop(1, '#ff2a2a');
  ctx.fillStyle = P.frost > 0 ? '#7fd8ff' : hg; ctx.fillRect(hx, 44, hw * P.heat / 100, 14);
  ctx.fillStyle = '#fff'; ctx.fillRect(hx + hw * 0.25, 42, 2, 18); ctx.fillRect(hx + hw * 0.8, 42, 2, 18);

  let status = '', sc = '#fff';
  if (P.jam > 0) { status = 'JAMMED!'; sc = Math.floor(time * 8) % 2 ? '#ff5b5b' : '#fff'; }
  else if (P.breath > 0) { status = P.over ? 'BLUE FIRE!' : 'FIRE!'; sc = P.over ? '#7fd8ff' : '#ffb347'; }
  else if (P.frost > 0) { status = 'ICE CORE ' + P.frost.toFixed(1) + 's'; sc = '#7fd8ff'; }
  else if (P.heat >= 80) { status = 'OVERDRIVE — BREATHE NOW!'; sc = Math.floor(time * 6) % 2 ? '#ff6a3a' : '#7fd8ff'; }
  else if (P.heat >= 25) { status = 'BREATH READY [SPACE]'; sc = '#ffd166'; }
  if (P.inCloud && P.heat > 1) { status = 'COOLING ❄'; sc = '#bfefff'; }
  label(status, 20, 82, 13, sc);

  // score / wave / combo
  label(score.toLocaleString(), W - 20, 34, 26, '#ffe14d', 'right');
  label('WAVE ' + wave + '   BEST ' + best.toLocaleString(), W - 20, 56, 13, '#d6c7ff', 'right');
  if (combo > 1) label('COMBO x' + combo, W - 20, 80, 18, '#ff7bd5', 'right');

  // boss bar
  const boss = enemies.find(e => e.type === 'boss');
  if (boss && boss.t > 2) {
    const bw = 360, bx = W / 2 - bw / 2;
    label('IRON WYRM', W / 2, 26, 14, '#ffb03a', 'center');
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, 32, bw, 10);
    ctx.fillStyle = '#ff5522'; ctx.fillRect(bx, 32, bw * Math.max(0, boss.hp) / boss.maxhp, 10);
  }

  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t * 2);
    label(banner.text, W / 2, H / 2 - 40, 46, '#fff', 'center');
    if (banner.sub) label(banner.sub, W / 2, H / 2 - 8, 18, '#ffd166', 'center');
    ctx.globalAlpha = 1;
  }

  if (hintT > 0) {
    ctx.globalAlpha = Math.min(1, hintT);
    label('WASD move  •  hold LEFT CLICK to fire  •  SPACE / RIGHT CLICK = fire breath (uses heat)  •  clouds cool your gun  •  P pause', W / 2, H - 16, 13, '#fff', 'center');
    ctx.globalAlpha = 1;
  }
}

function drawCrosshair() {
  const hot = state === 'play' && P.heat >= 80;
  ctx.strokeStyle = hot ? '#ff6a3a' : '#ffffff'; ctx.lineWidth = 2;
  const r = 10 + (state === 'play' ? P.heat / 100 * 8 : 0);   // crosshair widens with heat (less accurate)
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - r - 6, mouse.y); ctx.lineTo(mouse.x - r + 3, mouse.y);
  ctx.moveTo(mouse.x + r - 3, mouse.y); ctx.lineTo(mouse.x + r + 6, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - r - 6); ctx.lineTo(mouse.x, mouse.y - r + 3);
  ctx.moveTo(mouse.x, mouse.y + r - 3); ctx.lineTo(mouse.x, mouse.y + r + 6);
  ctx.stroke();
}

function drawTitle() {
  drawDragon(300, 290 + Math.sin(time * 2) * 14, 1, 2.1, time, PAL.player);
  ctx.fillStyle = 'rgba(10,5,20,0.45)'; ctx.fillRect(0, 0, W, H);
  label('GATLING DRAKE', W / 2, 140, 72, '#ffe14d', 'center');
  label('a dragon. a minigun. a sky full of trouble.', W / 2, 176, 18, '#ffb3d9', 'center');
  const lines = [
    ['WASD / ARROWS', 'fly'],
    ['HOLD LEFT CLICK', 'fire the gatling — it builds HEAT'],
    ['SPACE / RIGHT CLICK', 'turn heat into FIRE BREATH (burns bullets too)'],
    ['80%+ HEAT', 'breathe in the red zone for double-damage BLUE FIRE'],
    ['100% HEAT', 'your gun JAMS — don\'t get greedy'],
    ['CLOUDS', 'fly through them to cool down'],
  ];
  lines.forEach(([k, v], i) => {
    label(k, W / 2 - 20, 250 + i * 30, 16, '#7fe8d6', 'right');
    label(v, W / 2, 250 + i * 30, 16, '#fff');
  });
  if (Math.floor(time * 2) % 2) label('CLICK TO FLY', W / 2, 470, 26, '#fff', 'center');
  if (best) label('BEST ' + best.toLocaleString(), W / 2, 505, 14, '#d6c7ff', 'center');
}

function drawOver() {
  ctx.fillStyle = 'rgba(10,5,20,0.6)'; ctx.fillRect(0, 0, W, H);
  label('YOU GOT SHOT DOWN', W / 2, 190, 52, '#ff5b5b', 'center');
  label('SCORE  ' + score.toLocaleString(), W / 2, 250, 28, '#ffe14d', 'center');
  label('wave ' + wave + '   •   best ' + best.toLocaleString(), W / 2, 285, 18, '#d6c7ff', 'center');
  if (score >= best && score > 0) label('★ NEW BEST ★', W / 2, 320, 20, '#7dff8a', 'center');
  if (overT > 1 && Math.floor(time * 2) % 2) label('CLICK TO FLY AGAIN', W / 2, 390, 24, '#fff', 'center');
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBG();
  if (state === 'title') {
    drawClouds();
    drawTitle();
  } else {
    pickups.forEach(drawPickup);
    enemies.forEach(drawEnemy);
    if (state === 'play') drawPlayer();
    drawFlames();
    drawBullets();
    drawParticles();
    drawClouds();
    drawHUD();
    if (state === 'over') drawOver();
    if (paused) {
      ctx.fillStyle = 'rgba(10,5,20,0.6)'; ctx.fillRect(0, 0, W, H);
      label('PAUSED', W / 2, H / 2, 48, '#fff', 'center');
      label('press P or click to resume', W / 2, H / 2 + 34, 16, '#d6c7ff', 'center');
    }
  }
  ctx.restore();
  drawCrosshair();
}

// ---------- Game loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);   // cap dt so a lag spike can't teleport things
  last = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
for (let i = 0; i < 3; i++) clouds.push(makeCloud(rnd(100, W)));
requestAnimationFrame(loop);
</script>
